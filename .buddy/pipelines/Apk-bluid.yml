- pipeline: apk-bluid
  name: Apk bluid
  refs:
  - refs/heads/main
  fail_on_prepare_env_warning: true
  events:
  - type: WEBHOOK
  actions:
  - action: ./gradlew assembleDebug
    type: BUILD
    commands: |2

      # Find Android project Gradle Wrapper
      set -e

      echo "Searching for gradlew..."

      WRAPPER=$(find "$PWD" -type f -name gradlew -print -quit)

      if [ -z "$WRAPPER" ]; then
          echo "ERROR: gradlew not found!"
          echo "Repository files:"
          ls -la
          echo "Searching project folders:"
          find . -maxdepth 4 -type f | head -100
          exit 1
      fi

      # Go to Android project root
      PROJECT_DIR=$(dirname "$WRAPPER")
      cd "$PROJECT_DIR"

      echo "Project directory:"
      pwd

      # Build Debug APK
      chmod +x ./gradlew
      ./gradlew assembleDebug

      echo "APK BUILD COMPLETED!"
    setup_commands: apt-get update && apt-get install -y unzip curl
    cached_dirs:
    - /root/.gradle
    - /opt/android/sdk
    shell: BASH
    docker_image_name: library/eclipse-temurin
    docker_image_tag: "25"
